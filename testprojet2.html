<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte de densité Vélib – D3.js + carte Paris (fond statique)</title>

  <!-- Leaflet (fond de carte) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- D3 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Conteneur commun */
    #chart {
      position: relative;
      width: 900px;
      height: 650px;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      overflow: hidden;
      background: white;
    }

    /* Carte Leaflet en fond */
    #map {
      position: absolute;
      inset: 0;   /* top/right/bottom/left = 0 */
      z-index: 0; /* derrière */
    }

    /* SVG D3 au-dessus */
    svg {
      position: absolute;
      inset: 0;
      z-index: 1; /* devant */
      background: transparent;
      pointer-events: auto;
    }

    /* On empêche Leaflet de capter les clics */
    #map .leaflet-tile-pane,
    #map .leaflet-overlay-pane,
    #map .leaflet-control-container {
      pointer-events: none;
    }
  </style>
</head>

<body>

  <h1>Carte de densité des stations Vélib – D3.js</h1>

  <div id="chart">
    <div id="map"></div>
    <!-- le SVG D3 sera injecté ici -->
  </div>

  <script>
    const width = 900;
    const height = 650;

    // 1) Leaflet = juste un fond, statique
    const map = L.map("map", {
      zoomControl: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      dragging: false,
      touchZoom: false,
      boxZoom: false,
      keyboard: false
    }).setView([48.8566, 2.3522], 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    // 2) Ton SVG D3 (inchangé)
    const svg = d3.select("#chart")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    // 3) Charger le fichier CSV Vélib (séparateur ;)
    d3.dsv(";", "velib-disponibilite-en-temps-reel.csv", d => {
      const geo = d["Coordonnées géographiques"];
      if (!geo) return null;

      const [lat, lon] = geo.split(",").map(Number);
      d.lat = lat;
      d.lon = lon;
      return d;
    })
    .then(data => {

      const points = data.filter(d => d && !isNaN(d.lat) && !isNaN(d.lon));

      // Échelles D3 IDENTIQUES à ton code
      const x = d3.scaleLinear()
        .domain(d3.extent(points, d => d.lon))
        .range([0, width]);

      const y = d3.scaleLinear()
        .domain(d3.extent(points, d => d.lat))
        .range([height, 0]);

      // Densité IDENTIQUE
      const density = d3.contourDensity()
        .x(d => x(d.lon))
        .y(d => y(d.lat))
        .size([width, height])
        .bandwidth(25)
        (points);

      const color = d3.scaleSequential(d3.interpolateTurbo)
        .domain([0, d3.max(density, d => d.value)]);

      // Contours IDENTIQUES
      svg.selectAll("path")
        .data(density)
        .join("path")
        .attr("d", d3.geoPath())
        .attr("fill", d => color(d.value))
        .attr("stroke", "#333")
        .attr("stroke-width", 0.1)
        .attr("opacity", 0.35);

      // Points + clic infos (comme tu veux)
      svg.selectAll("circle")
        .data(points)
        .join("circle")
        .attr("cx", d => x(d.lon))
        .attr("cy", d => y(d.lat))
        .attr("r", 4)
        .style("cursor", "pointer")
        .attr("fill", "black")
        .attr("opacity", 0.5)
        .on("click", (event, d) => {
          alert(
            `Station : ${d["Nom station"]}\n` +
            `Capacité de la station : ${d["Capacité de la station"]}\n` +
            `Nombre bornettes libres : ${d["Nombre bornettes libres"]}`
          );
        });

    })
    .catch(error => console.error("Erreur de chargement CSV :", error));
  </script>

</body>
</html>
