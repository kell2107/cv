<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte de densité Vélib – D3.js</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #chart {
      display: flex;
      justify-content: center;
    }

    svg {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <h1>Carte de densité des stations Vélib – D3.js</h1>
  <div id="chart"></div>

  <!-- Import D3.js -->
<script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const width = 900;
    const height = 650;

    const svg = d3.select("#chart")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    // Charger le fichier CSV Vélib (séparateur ;)
    d3.dsv(";", "velib-disponibilite-en-temps-reel.csv", d => {

      // Lecture de la colonne "Coordonnées géographiques"
      const geo = d["Coordonnées géographiques"];
      if (!geo) return null;

      // Exemple : "48.8566, 2.3522"
      const [lat, lon] = geo.split(",").map(Number);
      d.lat = lat;
      d.lon = lon;
      return d;
    })
    .then(data => {

      const points = data.filter(d => d && !isNaN(d.lat) && !isNaN(d.lon));

      console.log("Premier point extrait :", points[0]);

      // Création des échelles
      const x = d3.scaleLinear()
        .domain(d3.extent(points, d => d.lon))
        .range([0, width]);

      const y = d3.scaleLinear()
        .domain(d3.extent(points, d => d.lat))
        .range([height, 0]);

      // Calcul de la densité
      const density = d3.contourDensity()
        .x(d => x(d.lon))
        .y(d => y(d.lat))
        .size([width, height])
        .bandwidth(25)
        (points);

      const color = d3.scaleSequential(d3.interpolateTurbo)
        .domain([0, d3.max(density, d => d.value)]);

      // Dessiner les contours
      svg.selectAll("path")
        .data(density)
        .join("path")
        .attr("d", d3.geoPath())
        .attr("fill", d => color(d.value))
        .attr("stroke", "#333")
        .attr("stroke-width", 0.1)
        .attr("opacity", 0.85);

      // Dessiner les points des stations
      svg.selectAll("circle")
        .data(points)
        .join("circle")
        .attr("cx", d => x(d.lon))
        .attr("cy", d => y(d.lat))
        .attr("r", 4)
        .style("cursor", "pointer")
        .attr("fill", "black")
        .attr("opacity", 0.5)
        .on("click", (event, d) => {
          alert(`Station: ${d["Nom station"]}\n`);
        });

        //ajouter une carte https://leafletjs.com/
        
    })
    .catch(error => console.error("Erreur de chargement CSV :", error));
  </script>

</body>
</html>
